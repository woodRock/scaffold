model:
  seq_len: 251
  vocab_size: 4
  cnn_channels: 128
  kernel_size: 7
  dropout: 0.1

pretraining:
  n_iterations: 50000
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  mask_ratio: 0.15
  grad_clip: 1.0
  log_every: 1000

data:
  jaspar_path: data/jaspar.json
  n_motifs_range: [1, 6]   # always at least 1 motif per sequence so every batch has learnable signal
  bg_probs: [0.295, 0.205, 0.205, 0.295]  # A,C,G,T — ~41% GC matching human genome composition

output:
  checkpoint_dir: checkpoints/
